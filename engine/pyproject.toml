[project]
name = "photoeditor"
version = "0.1.0"
description = "Motor local de photo-editor: catálogo, previews y revelado RAW"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rawpy>=0.21",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.3",
    "exifread>=3.0",
    "send2trash>=1.8",
    "mcp>=1.2",
    "httpx>=0.27",
    "astroalign>=2.6.2",
    "imageio-ffmpeg>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photoeditor"]
